name: Publish Tien Dao Gia Toc H5

on:
  push:
    branches: [main]
    paths:
      - "game-h5.zip"
      - "TienDaoGiaToc_Sprint3F45_Preview.zip"
      - "hotfix/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand H5 game package
        run: |
          test -f game-h5.zip || { echo "Missing game-h5.zip at repository root"; exit 1; }
          mkdir -p _site
          unzip -q game-h5.zip -d _site
          test -f _site/index.html
          test -d _site/assets/images
          test -d _site/js
          test -d _site/css
          touch _site/.nojekyll
      - name: Apply H5 web asset and typography hotfixes
        run: |
          cp hotfix/web-assets.js _site/js/web-assets-hotfix.js
          cp hotfix/typography.css _site/css/typography-hotfix.css
          cp hotfix/estate-scroll.css _site/css/estate-scroll.css
          cp hotfix/estate-raster.css _site/css/estate-raster.css
          cp hotfix/estate-raster.js _site/js/estate-raster.js
          sed -i 's@</head>@<link rel="stylesheet" href="css/typography-hotfix.css"><link rel="stylesheet" href="css/estate-scroll.css"><link rel="stylesheet" href="css/estate-raster.css"><script src="js/web-assets-hotfix.js"></script><script src="js/estate-raster.js"></script></head>@' _site/index.html
          grep -q 'web-assets-hotfix.js' _site/index.html
          test -f _site/css/typography-hotfix.css
          test -f _site/js/web-assets-hotfix.js
          test -f _site/js/estate-raster.js
          test -f _site/css/estate-scroll.css
          test -f _site/css/estate-raster.css
      - name: Enable stationary profession activities on official game
        run: |
          cp hotfix/workstation-live.js _site/js/workstation-live.js
          cp hotfix/workstation-live.css _site/css/workstation-live.css
          sed -i 's@</head>@<link rel="stylesheet" href="css/workstation-live.css"><script defer src="js/workstation-live.js"></script></head>@' _site/index.html
          grep -q 'workstation-live.js' _site/index.html
          test -s _site/js/workstation-live.js
          test -s _site/css/workstation-live.css
      - name: Publish optional 3F.4.5 art preview without changing live gameplay
        run: |
          if [ -f TienDaoGiaToc_Sprint3F45_Preview.zip ]; then
            mkdir -p _site/preview
            unzip -q TienDaoGiaToc_Sprint3F45_Preview.zip -d /tmp/tdgt-preview
            if [ -f /tmp/tdgt-preview/TienDaoGiaToc_Sprint3F45_Preview/index.html ]; then
              cp -R /tmp/tdgt-preview/TienDaoGiaToc_Sprint3F45_Preview/. _site/preview/
            elif [ -f /tmp/tdgt-preview/index.html ]; then
              cp -R /tmp/tdgt-preview/. _site/preview/
            else
              echo "Preview archive missing index.html" >&2
              exit 1
            fi
            test -f _site/preview/assets/tien-son.webp
            test -f _site/preview/assets/nam-walk.webp
            test -f _site/preview/assets/nu-walk.webp
            test -f _site/preview/assets/cuon-thu.webp
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
