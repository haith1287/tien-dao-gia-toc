name: Publish Tien Dao Gia Toc H5

on:
  push:
    branches: [main]
    paths:
      - "game-h5.zip"
      - "hotfix/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand H5 game package
        run: |
          test -f game-h5.zip || { echo "Missing game-h5.zip at repository root"; exit 1; }
          mkdir -p _site
          unzip -q game-h5.zip -d _site
          test -f _site/index.html
          test -d _site/assets/images
          test -d _site/js
          test -d _site/css
          touch _site/.nojekyll
      - name: Apply H5 web asset and typography hotfixes
        run: |
          cp hotfix/web-assets.js _site/js/web-assets-hotfix.js
          cp hotfix/typography.css _site/css/typography-hotfix.css
          cp hotfix/estate-scroll.css _site/css/estate-scroll.css
          cp hotfix/estate-scroll.js _site/js/estate-scroll.js
          sed -i 's@</head>@<link rel="stylesheet" href="css/typography-hotfix.css"><link rel="stylesheet" href="css/estate-scroll.css"><script src="js/web-assets-hotfix.js"></script><script src="js/estate-scroll.js"></script></head>@' _site/index.html
          grep -q 'web-assets-hotfix.js' _site/index.html
          test -f _site/css/typography-hotfix.css
          test -f _site/js/web-assets-hotfix.js
          test -f _site/js/estate-scroll.js
          test -f _site/css/estate-scroll.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
